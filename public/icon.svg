<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bg-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>
    
    <!-- 3D Sun Sphere Shading -->
    <radialGradient id="sun-3d" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="15%" stop-color="#fef08a" />
      <stop offset="45%" stop-color="#f59e0b" />
      <stop offset="75%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#991b1b" />
    </radialGradient>
    
    <!-- Solar Flare Gradient -->
    <radialGradient id="flare-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#ea580c" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#ea580c" stop-opacity="0" />
    </radialGradient>

    <!-- Ray Gradient -->
    <linearGradient id="ray-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ea580c" stop-opacity="0.2" />
    </linearGradient>

    <!-- Filter for 3D Drop Shadow -->
    <filter id="glow-filter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Slate Rounded App Icon Canvas -->
  <rect width="512" height="512" rx="112" fill="url(#bg-glow)" stroke="#38bdf8" stroke-width="4" stroke-opacity="0.3" />

  <!-- Outer Solar Flare Atmosphere -->
  <circle cx="256" cy="256" r="220" fill="url(#flare-glow)" />

  <!-- 3D Sun Emoji Ray Petals (12 radiating geometric rays) -->
  <g transform="translate(256, 256)">
    <!-- 8 Triangular Sharp Solar Rays -->
    <path d="M-14,-150 L0,-210 L14,-150 Z" fill="url(#ray-grad)" />
    <path d="M-14,-150 L0,-210 L14,-150 Z" fill="url(#ray-grad)" transform="rotate(45)" />
    <path d="M-14,-150 L0,-210 L14,-150 Z" fill="url(#ray-grad)" transform="rotate(90)" />
    <path d="M-14,-150 L0,-210 L14,-150 Z" fill="url(#ray-grad)" transform="rotate(135)" />
    <path d="M-14,-150 L0,-210 L14,-150 Z" fill="url(#ray-grad)" transform="rotate(180)" />
    <path d="M-14,-150 L0,-210 L14,-150 Z" fill="url(#ray-grad)" transform="rotate(225)" />
    <path d="M-14,-150 L0,-210 L14,-150 Z" fill="url(#ray-grad)" transform="rotate(270)" />
    <path d="M-14,-150 L0,-210 L14,-150 Z" fill="url(#ray-grad)" transform="rotate(315)" />

    <!-- 8 Secondary Intermediate Curved Flare Rays -->
    <circle cx="0" cy="-175" r="10" fill="#fef08a" opacity="0.85" transform="rotate(22.5)" />
    <circle cx="0" cy="-175" r="10" fill="#fef08a" opacity="0.85" transform="rotate(67.5)" />
    <circle cx="0" cy="-175" r="10" fill="#fef08a" opacity="0.85" transform="rotate(112.5)" />
    <circle cx="0" cy="-175" r="10" fill="#fef08a" opacity="0.85" transform="rotate(157.5)" />
    <circle cx="0" cy="-175" r="10" fill="#fef08a" opacity="0.85" transform="rotate(202.5)" />
    <circle cx="0" cy="-175" r="10" fill="#fef08a" opacity="0.85" transform="rotate(247.5)" />
    <circle cx="0" cy="-175" r="10" fill="#fef08a" opacity="0.85" transform="rotate(292.5)" />
    <circle cx="0" cy="-175" r="10" fill="#fef08a" opacity="0.85" transform="rotate(337.5)" />
  </g>

  <!-- 3D Sun Sphere with Depth -->
  <circle cx="256" cy="256" r="130" fill="url(#sun-3d)" filter="url(#glow-filter)" />

  <!-- Specular 3D Gloss Highlight -->
  <ellipse cx="210" cy="195" rx="55" ry="32" fill="#ffffff" opacity="0.45" transform="rotate(-30 210 195)" />
  <circle cx="190" cy="180" r="14" fill="#ffffff" opacity="0.75" />

  <!-- Heatwave Warning Badge Element in bottom corner -->
  <g transform="translate(340, 340)">
    <circle cx="36" cy="36" r="42" fill="#020617" stroke="#38bdf8" stroke-width="4" />
    <circle cx="36" cy="36" r="34" fill="#ef4444" />
    <path d="M36 18 L36 38 M36 46 L36 50" stroke="#ffffff" stroke-width="5" stroke-linecap="round" />
  </g>
</svg>
